version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    ignore:
      # mcp is capped below 2.0 on purpose (pyproject.toml); never take a major bump.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      python-major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    ignore:
      # typescript 7 is rejected by typescript-eslint (bundled in eslint-config-next 16.4.2), so lint fails.
      - dependency-name: typescript
        versions: [">=7"]
      # @types/node must match the Node major that runs (node 22 in Dockerfile.web and CI).
      - dependency-name: "@types/node"
        versions: [">=23"]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]
